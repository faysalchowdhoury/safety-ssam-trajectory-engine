[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "safety-ssam-trajectory-engine"
version = "1.0.0"
description = "FHWA SSAM-equivalent surrogate safety analysis for PTV Vissim trajectories, with spatial indexing and a low-latency API."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.12",
  "pydantic>=2.6,<3",
  "pyyaml>=6.0",
  "matplotlib>=3.8",
  "rtree>=1.2",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9", "redis>=5.0", "httpx>=0.27"]
vissim = ["pywin32>=306; sys_platform == 'win32'"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
ssam-engine = "ssam_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning:matplotlib.*"]
